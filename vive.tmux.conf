# vive Project Specific tmux Configuration

# --- Mouse Mode ---
# マウス操作を有効にする (ペイン選択、リサイズ、スクロールなど)
set-option -g mouse on

# --- Status Line Settings ---
# ステータスラインを有効化し、下部に表示
set-option -g status on
set-option -g status-position bottom

# ステータスライン左側の表示内容 (セッション名など)
set-option -g status-left "#[fg=green]#S #[fg=yellow]#I #[fg=cyan]#P"
set-option -g status-left-length 40

# ステータスライン右側の表示内容 (日付時刻など)
set-option -g status-right "%H:%M %d-%b-%y"
set-option -g status-right-length 40

# ステータスライン中央の表示内容 (ウィンドウリスト)
set-option -g status-justify centre
set-window-option -g window-status-format " #I: #W "
set-window-option -g window-status-current-format " #I: #W#F " # Fはフラグ(アクティビティなど)

# --- Pane Border & Title Settings ---
# ペインボーダーのステータスラインを有効にし、下部に表示 (ペインタイトル表示用)
set-option -g pane-border-status bottom

# ペインボーダーのステータスラインの書式 (インデックスとタイトルを表示)
set-option -g pane-status-format " #{pane_index}: #{pane_title} "

# アクティブなペインのボーダースタイル
set-option -g pane-active-border-style fg=green

# --- Colors ---
# ステータスラインの背景色
set-option -g status-style bg=black,fg=white

# --- History ---
# スクロールバックバッファの行数を増やす
set-option -g history-limit 10000

# --- Key Bindings (Optional examples, customize as needed) ---
# Prefix + r : tmux設定ファイルをリロード
# bind r source-file ~/.tmux.conf \; display "Reloaded!"
# (もしプロジェクト固有設定を読み込むなら、そのパスを指定)
# bind r source-file "$REPO_ROOT/vive.tmux.conf" \; display "Reloaded vive.tmux.conf!"

# --- Other Useful Options ---
# ウィンドウとペインのインデックスを1から開始 (デフォルトは0)
# set-option -g base-index 1
# set-window-option -g pane-base-index 1

# Escキーの遅延を短縮 (Vimユーザー向け)
set-option -s escape-time 0

# 256色表示を有効にする (ターミナルが対応している場合)
set-option -g default-terminal "screen-256color"
# または "tmux-256color"
# set-option -ag terminal-overrides ",xterm-256color:RGB" # TrueColorサポート (tmux 2.2+)

# 新しいウィンドウ/ペインでカレントディレクトリを引き継ぐ
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# --- vive Dashboard Specific Enhancements (if any) ---
