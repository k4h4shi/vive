[package]
name = "vive"
version = "0.1.0"
edition = "2024"
description = "A TUI application for managing Claude Code sessions with tmux"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
mockall = "0.13"
