[package]
name = "vive"
version = "0.1.0"
edition = "2024"
description = "A TUI application for managing Claude Code sessions with tmux"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
once_cell = "1"
ansi-to-tui = "7"
unicode-width = "0.2"
rmcp = { version = "0.1", features = ["server", "transport-io"] }
async-trait = "0.1"

[dev-dependencies]
mockall = "0.13"
